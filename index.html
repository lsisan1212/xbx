<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📚 筆記總覽 | Auto Index</title>
  <style>
    :root {
      --bg: #f8f9fa; --surface: #ffffff; --text: #1f2937; --text-muted: #6b7280;
      --primary: #2563eb; --primary-hover: #1d4ed8; --border: #e5e7eb;
      --radius: 12px; --shadow: 0 4px 12px rgba(0,0,0,0.06);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem 1rem; }
    header { max-width: 900px; margin: 0 auto 2rem; text-align: center; }
    header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); font-size: 0.95rem; }

    #container { max-width: 900px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.2rem; box-shadow: var(--shadow); transition: transform 0.2s, box-shadow 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); border-color: var(--primary); }
    .card h3 { font-size: 1.1rem; margin-bottom: 0.4rem; color: var(--primary); }
    .card .meta { font-size: 0.8rem; color: var(--text-muted); margin-top: auto; display: flex; justify-content: space-between; }
    
    .state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #dc2626; background: #fef2f2; padding: 1rem; border-radius: var(--radius); border: 1px solid #fecaca; }
    .empty { font-style: italic; }

    @media (max-width: 600px) { body { padding: 1rem; } header h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <header>
    <h1>📁 筆記與文件總覽</h1>
    <p>自動同步此 GitHub Pages 目錄下的所有 HTML 頁面</p>
  </header>

  <main id="container">
    <div id="state" class="state"><div class="spinner"></div>正在掃描目錄...</div>
    <div id="grid" class="grid" style="display:none;"></div>
  </main>
  <script>
    const CONFIG = { owner: '', repo: '', branch: 'main', path: '' };

    function autoDetectRepo() {
      const host = window.location.hostname;
      const path = window.location.pathname;
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0];
        const pathParts = path.split('/').filter(Boolean);
        CONFIG.owner = CONFIG.owner || owner;
        CONFIG.repo = CONFIG.repo || (pathParts[0] || `${owner}.github.io`);
      }
    }

    function cleanName(name) {
      return name.replace(/\.html$/i, '').replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    }

    const CACHE_KEY = 'gh_pages_index_cache';
    function getCache() {
      const raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const { data, time } = JSON.parse(raw);
      return (Date.now() - time < 3600000) ? data : null;
    }
    function setCache(data) { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, time: Date.now() })); }

    async function init() {
      autoDetectRepo();
      const stateEl = document.getElementById('state');
      const gridEl = document.getElementById('grid');

      if (!CONFIG.owner || !CONFIG.repo) {
        stateEl.innerHTML = `<div class="error">⚠️ 無法自動偵測 Repo。請編輯 CONFIG 填入 owner 與 repo。</div>`;
        return;
      }

      const cached = getCache();
      if (cached) return render(cached);

      try {
        const apiURL = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}?ref=${CONFIG.branch}`;
        const res = await fetch(apiURL);
        if (!res.ok) throw new Error(`API ${res.status}: ${res.statusText}`);
        const files = await res.json();

        const htmlFiles = files
          .filter(f => f.name.endsWith('.html') && f.name.toLowerCase() !== 'index.html')
          .sort((a, b) => a.name.localeCompare(b.name));

        setCache(htmlFiles);
        render(htmlFiles);
      } catch (err) {
        stateEl.innerHTML = `<div class="error">❌ 載入失敗：${err.message}<br><small>請確認 Repo 為 Public，且 Pages 發布分支與 CONFIG.branch 一致。</small></div>`;
      }
    }

    function render(files) {
      const stateEl = document.getElementById('state');
      const gridEl = document.getElementById('grid');
      stateEl.style.display = 'none';
      gridEl.style.display = 'grid';

      if (files.length === 0) {
        gridEl.innerHTML = `<div class="state empty">📭 此目錄下找不到其他 .html 檔案</div>`;
        gridEl.style.display = 'block';
        return;
      }

      // 🔧 防呆路徑解析
      const baseDir = window.location.pathname.replace(/\/[^\/]*$/, '/');

      gridEl.innerHTML = files.map(f => {
        const url = `${baseDir}${CONFIG.path || ''}${f.name}`;
        const date = new Date(f.updated_at || f.created_at).toLocaleDateString('zh-TW');
        return `
          <a href="${url}" class="card">
            <h3>${cleanName(f.name)}</h3>
            <div class="meta">
              <span>📄 ${f.name}</span>
              <span>🕒 ${date}</span>
            </div>
          </a>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
