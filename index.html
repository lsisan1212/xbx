<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📁 檔案目錄</title>
  <style>
    :root {
      --bg: #fafafa; --text: #111827; --text-muted: #6b7280;
      --link: #2563eb; --link-hover: #1d4ed8; --border: #e5e7eb;
      --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; padding: 2rem 1rem; }
    header { max-width: 800px; margin: 0 auto 2rem; text-align: center; }
    header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.3rem; }
    header p { color: var(--text-muted); font-size: 0.9rem; }

    #container { max-width: 800px; margin: 0 auto; }
    .link-list { list-style: none; padding: 0; }
    .link-list li { border-bottom: 1px solid var(--border); }
    .link-list li:last-child { border-bottom: none; }
    .link-list a {
      display: block; padding: 0.7rem 0.5rem; color: var(--link); text-decoration: none;
      font-size: 0.95rem; transition: all 0.2s ease; word-break: break-all; overflow-wrap: anywhere;
    }
    .link-list a:hover {
      color: var(--link-hover); background: #f3f4f6; padding-left: 1rem; text-decoration: underline;
    }
    .link-list a::before { content: "📄 "; margin-right: 0.4rem; opacity: 0.6; }

    .state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--link); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.8rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #dc2626; background: #fef2f2; padding: 0.8rem; border-radius: 8px; border: 1px solid #fecaca; margin-top: 1rem; }
    .empty { font-style: italic; margin-top: 2rem; }

    @media (max-width: 600px) { body { padding: 1rem; } header h1 { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <header>
    <h1>📁 檔案目錄</h1>
    <p>自動同步此資料夾下的所有 HTML 頁面</p>
  </header>

  <main id="container">
    <div id="state" class="state"><div class="spinner"></div>掃描中...</div>
    <div id="list" style="display:none;"></div>
  </main>

  <script>
    const CONFIG = { owner: '', repo: '', branch: 'main', path: '' };

    function autoDetectRepo() {
      const host = window.location.hostname;
      const path = window.location.pathname;
      if (host.endsWith('.github.io')) {
        const owner = host.split('.')[0];
        const pathParts = path.split('/').filter(Boolean);
        CONFIG.owner = CONFIG.owner || owner;
        CONFIG.repo = CONFIG.repo || (pathParts[0] || `${owner}.github.io`);
      }
    }

    const CACHE_KEY = 'gh_index_cache';
    function getCache() {
      const raw = sessionStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const { data, time } = JSON.parse(raw);
      return (Date.now() - time < 3600000) ? data : null;
    }
    function setCache(data) { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ data, time: Date.now() })); }

    async function init() {
      autoDetectRepo();
      const stateEl = document.getElementById('state');
      const listEl = document.getElementById('list');

      if (!CONFIG.owner || !CONFIG.repo) {
        stateEl.innerHTML = `<div class="error">⚠️ 無法自動偵測 Repo。請編輯 CONFIG 填入 owner 與 repo。</div>`;
        return;
      }

      const cached = getCache();
      if (cached) return render(cached);

      try {
        const apiURL = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}?ref=${CONFIG.branch}`;
        const res = await fetch(apiURL);
        if (!res.ok) throw new Error(`API ${res.status}: ${res.statusText}`);
        const files = await res.json();

        const htmlFiles = files
          .filter(f => f.name.endsWith('.html') && f.name.toLowerCase() !== 'index.html')
          // 🔽 依檔名數字/日期由大到小遞減排序
          .sort((a, b) => b.name.localeCompare(a.name, 'zh-Hant', { numeric: true }));

        setCache(htmlFiles);
        render(htmlFiles);
      } catch (err) {
        stateEl.innerHTML = `<div class="error">❌ 載入失敗：${err.message}<br><small>請確認 Repo 為 Public，且 Pages 分支與 CONFIG.branch 一致。</small></div>`;
      }
    }

    function render(files) {
      const stateEl = document.getElementById('state');
      const listEl = document.getElementById('list');
      stateEl.style.display = 'none';
      listEl.style.display = 'block';

      if (files.length === 0) {
        listEl.innerHTML = `<div class="state empty">📭 此目錄下找不到其他 .html 檔案</div>`;
        return;
      }

      const baseDir = window.location.pathname.replace(/\/[^\/]*$/, '/');
      listEl.innerHTML = `<ul class="link-list">` + files.map(f => {
        const url = `${baseDir}${CONFIG.path || ''}${f.name}`;
        return `<li><a href="${url}">${f.name}</a></li>`;
      }).join('') + `</ul>`;
    }

    init();
  </script>
</body>
</html>
